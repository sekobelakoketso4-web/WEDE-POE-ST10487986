<body>

    <h1>Koki's Lash Studio</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="services.html">Services</a>

    <main>

        <h2>Contact Us</h2>

        <p>Have a question or want to book your lash appointment? Fill in the form below.</p>

        <form id="contactForm">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

           <label for="message">Message</label>
           <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

            <button type="submit">Send Message</button>
            <p id="contactFormMessage" role="status"></p>




            

        </form>

    </main>

</body>

</html>
