
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koki's Lash Studio - Enquiry</title>
    <meta name="description" content="Contact Koki's Lash Studio to enquire about lash services and appointments.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Koki's Lash Studio</h1>
        <p>Beauty begins with confidence.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html">Enquiry</a>
    </nav>

    <main>
        <h2>Make an Enquiry</h2>
        <p>Complete the form below to ask about our lash services.</p>

     
<form id="enquiryForm">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required minlength="2">

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="service">Choose a Lash Service:</label>
    <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option value="Classic Lashes">Classic Lashes</option>
        <option value="Hybrid Lashes">Hybrid Lashes</option>
        <option value="Cat Eye Lashes">Cat Eye Lashes</option>
        <option value="Volume Lashes">Volume Lashes</option>
        <option value="Wispy Lashes">Wispy Lashes</option>
    </select>

    <label for="date">Preferred Appointment Date:</label>
    <input type="date" id="date" name="date" required>

    <label for="message">Your Enquiry:</label>
    <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

    <button type="submit">Send Enquiry</button>

    <p id="formMessage" role="status"></p>
</form>
  
    </main>

<script src="script.js"></script>
</body>
</html>
</body>
</html>
